name: Promote immutable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing final SemVer tag
        required: true
      artifact_sha256:
        description: Expected release archive SHA-256
        required: true
      evidence_asset:
        description: Attached format-2 acceptance evidence filename
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: stable-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
      - name: Verify existing immutable assets and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.artifact_sha256 }}
          EVIDENCE_ASSET: ${{ inputs.evidence_asset }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EVIDENCE_ASSET" =~ ^[A-Za-z0-9._-]+\.json$ ]]
          mkdir -p promotion
          gh release download "$RELEASE_TAG" --dir promotion --pattern 'robopark-release-*.zip' --pattern "$EVIDENCE_ASSET"
          artifact="$(find promotion -maxdepth 1 -type f -name 'robopark-release-*.zip' -print -quit)"
          test -n "$artifact"
          test "$(sha256sum "$artifact" | cut -d' ' -f1)" = "$EXPECTED_SHA"
          source_sha="$(git rev-parse HEAD)"
          manifest_sha="$(python3 -c 'import hashlib,sys,zipfile; archive=zipfile.ZipFile(sys.argv[1]); print(hashlib.sha256(archive.read("manifest.json")).hexdigest())' "$artifact")"
          python3 scripts/release_acceptance.py \
            --validate-promotion "promotion/$EVIDENCE_ASSET" \
            --source-sha "$source_sha" \
            --artifact-sha256 "$EXPECTED_SHA" \
            --manifest-digest "$manifest_sha"
      - name: Promote without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --prerelease=false
