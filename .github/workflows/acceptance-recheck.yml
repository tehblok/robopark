name: Temporary operational acceptance recheck

on:
  push:
    branches: [codex/robopark-redesign]

permissions:
  contents: read

jobs:
  acceptance:
    name: Compare final acceptance against verified Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked test tooling
        working-directory: apps/web
        run: npm ci
      - name: Compare all acceptance journeys in pinned Linux
        working-directory: apps/web
        run: npm run test:e2e:linux
      - name: Ensure no baseline or source was changed
        run: git diff --exit-code
