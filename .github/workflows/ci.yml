name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: 0.11.31
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies for Linux snapshots
        working-directory: apps/web
        run: npm ci

      - name: Verify responsive browser journeys in the pinned Linux image
        working-directory: apps/web
        run: bash scripts/playwright-linux.sh update

      - name: Export Linux visual baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-linux-snapshots
          path: |
            apps/web/e2e/app-shell.spec.ts-snapshots
            apps/web/e2e/operational/responsive-visual.spec.ts-snapshots

      - name: Verify repository
        run: ./scripts/verify.sh
