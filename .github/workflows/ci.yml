name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    # Includes the complete route/role/theme/viewport matrix and three engines.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: 0.11.31
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The default gate includes unprivileged host/installer tests.
      - name: Verify repository governance
        run: python3 scripts/check-tech-debt.py && python3 scripts/check-module-boundaries.py

      - name: Verify repository
        run: ./scripts/verify.sh

      - name: Audit locked frontend, API and bot dependencies
        run: sh scripts/audit-dependencies.sh

      - name: Verify the optional bot image and its runtime dependencies
        run: |
          docker build -t robopark-bot:verify apps/bot
          docker run --rm --entrypoint python robopark-bot:verify -c "import pandas, requests, matplotlib, qrcode, PIL"

      - name: Verify responsive browser journeys in the pinned Linux image
        working-directory: apps/web
        run: npm run test:e2e:linux -- --workers=2

      - name: Verify the production PWA in the pinned Linux image
        working-directory: apps/web
        run: npm run test:e2e:pwa:linux

      - name: Verify workflows in Chromium, Firefox and WebKit
        working-directory: apps/web
        run: npm run test:e2e:crossbrowser:linux -- --workers=2
