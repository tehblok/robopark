name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.12 .venv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --python .venv/bin/python

      # `ruff format` is intentionally not enforced yet: the existing codebase
      # predates it and a repo-wide reformat would bury real changes in noise.
      # Run `ruff format` as a separate, deliberate commit to enable it.
      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Tests
        run: .venv/bin/python -m pytest -q

      - name: Migration parity (models vs alembic)
        run: .venv/bin/python -m pytest tests/test_models_migration.py -q

  web:
    name: Web (lint + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check and build
        run: npm run build

      - name: Tests
        run: npm test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t robopark-api:ci apps/api

      - name: Build web image
        run: docker build -t robopark-web:ci apps/web
