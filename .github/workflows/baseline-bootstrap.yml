name: Temporary Playwright baseline bootstrap

on:
  push:
    branches: [codex/robopark-redesign]

permissions:
  contents: write

jobs:
  bootstrap:
    name: Generate pinned Linux visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install host dependencies
        working-directory: apps/web
        run: npm ci

      - name: Generate baselines in the pinned Linux image
        working-directory: apps/web
        run: npm run test:e2e:update:linux

      - name: Compare baselines in a fresh pinned Linux run
        working-directory: apps/web
        run: npm run test:e2e:linux

      - name: Commit only generated snapshot PNGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "robopark-ci"
          git config user.email "robopark-ci@users.noreply.github.com"
          git add \
            apps/web/e2e/app-shell.spec.ts-snapshots/mechanic-shell-dark-390.png \
            apps/web/e2e/app-shell.spec.ts-snapshots/operator-shell-light-1440.png
          expected_paths="$(printf '%s\n' \
            'apps/web/e2e/app-shell.spec.ts-snapshots/mechanic-shell-dark-390.png' \
            'apps/web/e2e/app-shell.spec.ts-snapshots/operator-shell-light-1440.png')"
          staged_paths="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$staged_paths" = "$expected_paths"
          git commit -m "test(web): add pinned Linux visual baselines [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:codex/robopark-redesign
