# Robopark runs entirely on the host (Armbian / home server).
# Remote access: Tuna HTTPS tunnel — see deploy/README.md.
# Do not publish 8080 to the internet; tuna agent connects to localhost.

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: robopark
      POSTGRES_DB: robopark
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - ${ROBOPARK_POSTGRES_SOURCE:-robopark_postgres}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robopark -d robopark"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../apps/api
    env_file:
      # Copy deploy/host.env.example → deploy/host.env and point HOST_ENV_FILE at it.
      # Do not fall back to the example file (empty SECRET_KEY).
      - ${HOST_ENV_FILE:-./host.env}
    environment:
      DATABASE_URL: postgresql+psycopg://robopark@db:5432/robopark
      PGPASSFILE: /run/secrets/pgpass
      REPORT_ATTACHMENTS_DIR: /data/report-attachments
      OPS_DIR: /data/ops
      OPS_HOST_ENV_PATH: /run/robopark/snapshot.env
      # UVICORN_WORKERS comes from host.env; entrypoint defaults to 2.
    volumes:
      - ${ROBOPARK_DATA_SOURCE:-robopark_data}:/data
      - ${ROBOPARK_PGPASS_FILE:?run sudo python3 compose_secrets.py first}:/run/secrets/pgpass:ro
      - ${ROBOPARK_SNAPSHOT_CONFIG_FILE:?run sudo compose-production.sh first}:/run/robopark/snapshot.env:ro
      # Hide the root-private checkout file beneath the repository bind. The API
      # sees only the generated non-secret projection above.
      - ${ROBOPARK_SNAPSHOT_CONFIG_FILE:?run sudo compose-production.sh first}:/host-repo/deploy/host.env:ro
      # Royal ZIP updates copy onto the checkout; ops-agent rebuilds images.
      - ..:/host-repo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    init: true
    mem_limit: 3g
    stop_grace_period: 45s
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Localhost only — Tuna agent on the host forwards public HTTPS here.
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    init: true
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ops-agent:
    # Explicit compatibility profile for existing manual installations.
    profiles: [legacy]
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOST_ENV_FILE: /host-repo/deploy/host.env
      ROBOPARK_POSTGRES_PASSWORD_FILE: /etc/robopark/postgres-password
      ROBOPARK_PGPASS_FILE: /etc/robopark/pgpass
      ROBOPARK_SNAPSHOT_CONFIG_FILE: /etc/robopark/snapshot.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/host-repo
      - ${ROBOPARK_DATA_SOURCE:-robopark_data}:/data
      - /etc/robopark:/etc/robopark:ro
    working_dir: /host-repo/deploy
    command: ["sh", "/host-repo/deploy/ops-agent.sh"]
    restart: unless-stopped
    init: true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  robopark_data:
  robopark_postgres:

secrets:
  postgres-password:
    file: ${ROBOPARK_POSTGRES_PASSWORD_FILE:?run sudo python3 compose_secrets.py first}
