# Robopark runs entirely on the host (Armbian / home server).
# Remote access: WireGuard on a VPS — see deploy/vps/README.md.
# Do not run this Compose file on the VPS.

services:
  api:
    build:
      context: ../apps/api
    env_file:
      - ${HOST_ENV_FILE:-./host.env.example}
    environment:
      DATABASE_URL: sqlite:////data/robopark.db
    volumes:
      - robopark_data:/data
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
    depends_on:
      - api
    ports:
      # Bind on all interfaces so WireGuard peers can reach the SPA + /api proxy.
      - "8080:80"
    restart: unless-stopped

volumes:
  robopark_data:
