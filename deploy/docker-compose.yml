# Robopark runs entirely on the host (Armbian / home server).
# Remote access: Tuna HTTPS tunnel — see deploy/README.md.
# Do not publish 8080 to the internet; tuna agent connects to localhost.

services:
  api:
    build:
      context: ../apps/api
    env_file:
      # Copy deploy/host.env.example → deploy/host.env and point HOST_ENV_FILE at it.
      # Do not fall back to the example file (empty SECRET_KEY).
      - ${HOST_ENV_FILE:-./host.env}
    environment:
      DATABASE_URL: sqlite:////data/robopark.db
      OPS_DIR: /data/ops
      OPS_HOST_ENV_PATH: /host-repo/deploy/host.env
      UVICORN_WORKERS: "2"
    volumes:
      - robopark_data:/data
      # Royal ZIP updates copy onto the checkout; ops-agent rebuilds images.
      - ..:/host-repo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Localhost only — Tuna agent on the host forwards public HTTPS here.
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ops-agent:
    image: docker:27-cli
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/host-repo
      - robopark_data:/data
    working_dir: /host-repo/deploy
    command: ["sh", "/host-repo/deploy/ops-agent.sh"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  robopark_data:
