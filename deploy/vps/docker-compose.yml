# WireGuard hub on the VPS. Robopark API/web/SQLite stay on the host.
# See README.md in this directory.

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: robopark-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Moscow}
      # Public IP or DNS of this VPS (WireGuard clients dial this).
      SERVERURL: ${SERVERURL:?set SERVERURL in wg.env}
      SERVERPORT: ${SERVERPORT:-51820}
      # Comma-separated peer names; first peer "host" is the Armbian/home server.
      PEERS: ${PEERS:-host,operator1,operator2}
      PEERDNS: ${PEERDNS:-auto}
      INTERNAL_SUBNET: ${INTERNAL_SUBNET:-10.8.0.0}
      # Split tunnel: only the VPN subnet goes through WG (recommended).
      ALLOWEDIPS: ${ALLOWEDIPS:-10.8.0.0/24}
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "${SERVERPORT:-51820}:51820/udp"
    restart: unless-stopped
