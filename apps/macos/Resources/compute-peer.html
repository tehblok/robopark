<!doctype html><meta charset="utf-8"><script>
(()=>{'use strict';let current=null;
const post=x=>webkit.messageHandlers.peer.postMessage(x);
const close=s=>{s.cancelled=true;try{s.channel&&s.channel.close();s.pc.close()}catch(_){}s.channel=null;if(current===s)current=null};
const fail=(s,error)=>{if(current!==s)return;const ids=s.ids,detail=String(error||'peer_failed').slice(0,160);close(s);post({type:'failed',detail,...ids})};
const waitIce=(s,limit=3000)=>new Promise((resolve,reject)=>{if(s.pc.iceGatheringState==='complete')return resolve();let timer;const clean=()=>{clearTimeout(timer);s.pc.removeEventListener('icegatheringstatechange',change)};const done=()=>{clean();s.cancelled?reject(Error('cancelled')):resolve()};const change=()=>{if(s.pc.iceGatheringState==='complete')done()};s.pc.addEventListener('icegatheringstatechange',change);timer=setTimeout(done,limit)});
const waitBuffer=async(s,c,empty=false)=>{const deadline=Date.now()+5000,limit=empty?0:262144;while(c.bufferedAmount>limit){if(current!==s||s.cancelled||c.readyState!=='open'||Date.now()>deadline)throw Error('buffer');await new Promise(r=>setTimeout(r,10))}};
const sendBytes=async(s,c,bytes,onQueued)=>{if(bytes.byteLength<1||bytes.byteLength>8388608)throw Error('size');c.send(JSON.stringify({type:'begin',bytes:bytes.byteLength}));for(let i=0;i<bytes.byteLength;i+=16384){await waitBuffer(s,c);c.send(bytes.slice(i,i+16384))}c.send(JSON.stringify({type:'end'}));onQueued();await waitBuffer(s,c,true)};
function bind(s,c){if(current!==s||s.channel){c.close();return}s.channel=c;c.binaryType='arraybuffer';let expected=-1,total=0,chunks=[],resultSent=false;c.onclose=()=>{if(current===s&&!s.complete)fail(s,'channel_closed')};c.onerror=()=>fail(s,'channel_error');c.onmessage=async event=>{try{if(current!==s)throw Error('stale');if(typeof event.data==='string'){let h=JSON.parse(event.data);if(resultSent){if(h.type==='ack'&&h.job_id===s.ids.job_id&&h.attempt_id===s.ids.attempt_id&&h.payload_sha256===s.ids.payload_sha256&&h.outcome==='completed'){s.complete=true;post({type:'complete',...s.ids});close(s);return}throw Error('ack')}if(h.type==='begin'&&Number.isInteger(h.bytes)&&h.bytes>0&&h.bytes<=8388608&&expected<0){expected=h.bytes;return}if(h.type==='end'&&expected===total){let all=new Uint8Array(total),at=0;for(const x of chunks){all.set(new Uint8Array(x),at);at+=x.byteLength}let response=await fetch(location.pathname.replace(/peer$/,'execute'),{method:'POST',headers:{'Content-Type':'application/json'},body:new TextDecoder().decode(all)});if(!response.ok)throw Error('worker_'+response.status);let result=new Uint8Array(await response.arrayBuffer());await sendBytes(s,c,result,()=>{resultSent=true});return}throw Error(h.type==='ack'?'unexpected_ack':'sequence')}if(resultSent||!(event.data instanceof ArrayBuffer)||event.data.byteLength<1||event.data.byteLength>16384||expected<0||total+event.data.byteLength>expected)throw Error('chunk');chunks.push(event.data);total+=event.data.byteLength}catch(error){fail(s,error)}}}
window.roboparkAcceptOffer=async payload=>{const ids={job_id:payload.job_id,attempt_id:payload.attempt_id,payload_sha256:payload.payload_sha256};if(current){post({type:'failed',detail:'busy',...ids});return}const s={ids,pc:new RTCPeerConnection({iceServers:[{urls:'stun:stun.cloudflare.com:3478'}]}),channel:null,cancelled:false,complete:false};current=s;try{s.pc.ondatachannel=e=>{if(e.channel.label!=='robopark-compute-v1')e.channel.close();else bind(s,e.channel)};await s.pc.setRemoteDescription(payload.offer);await s.pc.setLocalDescription(await s.pc.createAnswer());await waitIce(s);if(current!==s||s.cancelled)throw Error('cancelled');post({type:'answer',...ids,answer:{type:'answer',sdp:s.pc.localDescription.sdp}})}catch(error){fail(s,error)}};
window.roboparkCancel=()=>{if(current)close(current)};
post({type:'ready'});
})();</script>
