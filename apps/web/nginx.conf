map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $forwarded_proto $strict_transport_security {
    default "";
    https   "max-age=31536000";
}

# Shared-memory limits apply across nginx workers before expensive API work.
# Login has a separate budget; authenticated 200-user polling shares the wider
# API ceiling. Volumetric attacks still require protection at the tunnel edge.
limit_req_zone $binary_remote_addr zone=robopark_login:10m rate=5r/s;
limit_req_zone $server_name zone=robopark_api_rate:1m rate=200r/s;
limit_conn_zone $server_name zone=robopark_login_inflight:1m;
limit_conn_zone $server_name zone=robopark_api_inflight:1m;

upstream robopark_api {
    zone robopark_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # JSON/API payloads and resumable OTA chunks share this body ceiling.
    client_max_body_size 16m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    # Security headers. No CSP `unsafe-inline` for scripts: the SPA is bundled.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $strict_transport_security always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Tuna runs on the host; Docker translates its localhost connection to the
    # exact bridge gateway generated by the container entrypoint.
    set_real_ip_from 127.0.0.1;
    include /etc/nginx/realip.d/*.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # OTA is resumable: the total package limit is enforced by the API,
    # while each HTTP chunk stays within the ordinary 16 MiB body ceiling.
    location /api/admin/ops/ {
        limit_req zone=robopark_api_rate burst=200 nodelay;
        limit_conn robopark_api_inflight 128;
        proxy_request_buffering off;
        proxy_pass http://robopark_api/admin/ops/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location ~ ^/api/auth/(login|register)$ {
        client_max_body_size 8k;
        limit_req zone=robopark_login burst=20 nodelay;
        limit_conn robopark_login_inflight 16;
        # Regex locations cannot use a URI part in proxy_pass.
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://robopark_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Terminal streams need a real WebSocket tunnel. Keep this location before
    # the general API proxy so nginx does not strip the Upgrade request.
    location ~ "^/api/admin/terminal/sessions/[0-9a-fA-F-]{36}/stream$" {
        client_max_body_size 8k;
        limit_req zone=robopark_api_rate burst=40 nodelay;
        limit_conn robopark_api_inflight 4;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://robopark_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 45s;
        proxy_read_timeout 45s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    location /api/admin/terminal/ {
        client_max_body_size 8k;
        limit_req zone=robopark_api_rate burst=40 nodelay;
        limit_conn robopark_api_inflight 16;
        proxy_pass http://robopark_api/admin/terminal/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        limit_req zone=robopark_api_rate burst=200 nodelay;
        limit_conn robopark_api_inflight 128;
        proxy_pass http://robopark_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Tracker and Emergency calls can be slow; keep the browser waiting
        # rather than returning a premature 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Auth responses must never be cached by an intermediary.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Hashed build assets are immutable and safe to cache aggressively.
    # Re-declare security headers: nginx drops inherited add_header in a
    # location that defines its own.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $strict_transport_security always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Revalidate PWA metadata and worker on every visit. A stale worker would
    # otherwise keep an old shell even after the host has been updated.
    location ~ ^/(sw\.js|manifest\.webmanifest|offline\.html)$ {
        types {
            text/javascript js;
            application/manifest+json webmanifest;
            text/html html;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $strict_transport_security always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # The SPA entrypoint must never be cached, otherwise a deploy is invisible
    # until the browser decides to revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $strict_transport_security always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # The terminal is an online-only document and must never use the SPA's
    # offline navigation fallback.
    location = /terminal.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $strict_transport_security always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "clipboard-read=(), clipboard-write=(), geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
