[project]
name = "robopark-api"
version = "0.1.39"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "certifi>=2026.7.22",
  "cryptography>=44.0.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.9",
  "yandex-tracker-client>=2.8",
  "importlib-metadata>=9.0.0",
  "regex>=2026.9.3",
  "openpyxl==3.1.5",
]

[project.scripts]
robopark-verify-attachments = "robopark_api.verify_report_attachments:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robopark_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
  # Long lines are reported by the formatter, not the linter, in this codebase.
  "E501",
  # `Depends(...)` / `Query(...)` in defaults is the documented FastAPI style.
  "B008",
  # PEP-695 generics would drop support for tooling pinned to older syntax.
  "UP047",
]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated and follow their own conventions.
"alembic/versions/*" = ["E", "W"]
