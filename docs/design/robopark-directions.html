<body>
  <div class="chooser"><strong>Robopark · макеты с демо-данными</strong><label>Вариант <select id="variant"><option value="a">A · Спокойный рабочий</option><option value="b">B · Редакционный</option><option value="c">C · Центр управления</option></select></label><label>Экран <select id="page"><option value="overview">Обзор</option><option value="work">Работа</option><option value="analytics">Аналитика</option><option value="settings">Настройки</option></select></label><label>Тема <select id="theme"><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label></div>
  <div id="mock" class="mock" data-variant="a" data-theme="light"></div>
  <script>
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    for (const [id,key] of [['variant','v'],['page','page'],['theme','theme']]) { const value=params.get(key); if(value && [...$(id).options].some(option=>option.value===value)) $(id).value=value; }
    const nav=[['overview','◫','Обзор'],['work','☷','Работа'],['analytics','▥','Аналитика'],['settings','⚙','Настройки']];
    const tasks=[
      ['YASADR…0318','Ошибка навигации','В очереди','Не взята','5 ч 42 м','Просрочено','18 ч 04 м','bad'],
      ['YASADR…1427','Нет связи с приводом','В работе','А. Петров','4 ч 35 м','25 м','27 ч 18 м','warn'],
      ['YASADR…2086','Замена АКБ','Ждём деталь','М. Власова','3 ч 08 м','1 ч 52 м','42 ч 30 м','warn'],
      ['YASADR…0901','Проверка после ремонта','Проверка','А. Петров','2 ч 17 м','2 ч 43 м','6 ч 15 м','good'],
      ['YASADR…1012','Сбой Wi‑Fi','В очереди','Не взята','0 ч 43 м','4 ч 17 м','3 ч 51 м','good']
    ];
    function metric(title,value,foot,tone=''){return `<div class="metric ${tone}"><small>${title}</small><strong>${value}</strong><em>${foot}</em></div>`}
    function rows(){return `<div class="task-head"><span>Робот и задача</span><span>Этап</span><span>Ответственный</span><span>SLA · из 5 ч</span><span>Простой</span></div>${tasks.map(t=>`<div class="task-row"><div><b>${t[0]}</b><small class="task-title">${t[1]}</small></div><div><span class="tag ${t[7]}">${t[2]}</span></div><div>${t[3]}</div><div><span class="sla ${t[7]}">${t[4]}</span><small>${t[5]}</small></div><div><b>${t[6]}</b></div></div>`).join('')}`}
    function sectionOverview(){return `<div class="metrics">${metric('Активные задачи','12','в 3 парках')}${metric('SLA нарушен','2','нужно решение сейчас','hot')}${metric('Риск в течение часа','3','приоритет очереди','soon')}${metric('Без ответственного','2','механик ещё не взял')}</div><div class="overview-grid"><section class="surface"><div class="surface-head"><div><h2>Очередь решений</h2><p>Сначала просроченные и ближайшие к сроку</p></div><button class="link">Все задачи →</button></div>${rows()}</section><div class="side-stack"><section class="surface signal"><h2>Что требует внимания</h2><div class="signal-item"><b>1 робот ожидает АКБ</b><span>Связано с задачей YASADR…2086</span></div><div class="signal-item"><b>2 задачи без новых данных</b><span>Последняя сверка Tracker 10:42</span></div><div class="signal-item"><b>Парк «Север» без механика</b><span>Следующая смена в 12:00</span></div></section><section class="surface signal callout"><h2>Следующее действие</h2><p>Задача YASADR…0318 просрочена и не взята в работу. Проверьте блокировку и свяжитесь с механиком парка.</p><button class="button">Открыть задачу →</button></section></div></div>`}
    function sectionWork(){return `<div class="work-grid"><section class="surface work-hero"><span class="overline">YASADR-1427 · Север / Москва</span><h2>Нет связи с приводом</h2><p>Робот YASADR00000001427 · задача в работе · взята механиком А. Петровым</p><div class="steps"><span class="step">В очереди</span><span class="step current">Диагностика и ремонт</span><span class="step">Проверка</span><span class="step">Закрыто в Tracker</span></div><h3>Следующий шаг: устранить ошибку</h3><p>Размеченная ошибка требует внимания до возврата робота. Окончательное решение принимает оператор.</p><div class="checks"><div class="check"><i>✓</i> Комментарий и код дефекта заполнены</div><div class="check"><i>✓</i> Фото после ремонта приложено</div><div class="check needs"><i>!</i> Размеченная ошибка привода требует внимания</div><div class="check"><i>✓</i> Два АКБ подключены: 94% и 92%</div></div><div class="work-actions"><button class="button primary">Открыть ошибки</button><button class="button">Добавить результат</button></div></section><section class="surface work-side"><h2>Контекст задачи</h2><div class="kv"><span>SLA использовано</span><b>4 ч 35 м / 5 ч</b></div><div class="kv"><span>До срока</span><b>25 м</b></div><div class="kv"><span>Простой</span><b>27 ч 18 м</b></div><div class="kv"><span>Источник</span><b>Tracker · 10:42</b></div><div class="kv"><span>Синхронизация</span><b>Подтверждено</b></div></section></div>`}
    function sectionAnalytics(){return `<div class="metrics">${metric('В SLA закрыто','81%','34 из 42 подтверждённых')}${metric('Медиана простоя','13,4 ч','от очереди до закрытия')}${metric('Хвост просрочки','2','активные задачи','hot')}${metric('Покрытие','88%','6 задач без полной истории')}</div><div class="analysis-grid"><section class="surface chart"><h2>Входящие задачи</h2><p>Последние 7 дней · задачи, шт. · по времени парка</p><div class="bars">${[45,60,52,80,65,72,88].map((h,i)=>`<div class="bar ${i===6?'active':''}" style="height:${h}%"><span>${[5,7,6,9,7,8,10][i]}</span></div>`).join('')}</div><div class="axis"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div></section><section class="surface insight"><h2>Где теряем время</h2><div class="signal-item"><b>Ожидание деталей · +26%</b><span>7 задач, 3 парка · открыть выборку →</span></div><div class="signal-item"><b>Повторные ошибки привода</b><span>4 робота за неделю · открыть роботов →</span></div><div class="signal-item"><b>История ещё собирается</b><span>6 задач без точного входа в очередь; они не улучшили показатель SLA.</span></div></section></div>`}
    function setting(icon,title,description,state){return `<section class="surface setting"><div class="glyph">${icon}</div><h2>${title}</h2><p>${description}</p><div class="setting-foot"><span class="tag good">${state}</span><button class="link">Открыть →</button></div></section>`}
    function sectionSettings(){return `<div class="settings-grid">${setting('⌁','Подключения','Tracker, диагностика роботов и тест получения задач. Ошибки и время последней проверки видны здесь.','2 из 2 работают')}${setting('◫','Парки и доступ','Часовые пояса, состав парков, права механиков и операторов, приглашения.','3 парка')}${setting('✦','Правила работы','Проверки перед передачей, подтверждение оператора, неизменный SLA 5 рабочих часов.','Правила действуют')}${setting('◈','Хост и безопасность','Состояние worker, копии, занятое место, TOTP и безопасное обслуживание.','Требует проверки')}</div>`}
    const pages={overview:['Обзор смены','Что требует решения сейчас','Задачи обновлены при открытии · Tracker 10:42',sectionOverview],work:['Работа','Каждой задаче — понятный следующий шаг.','Данные синхронизированы · последняя проверка робота 10:39',sectionWork],analytics:['Аналитика','Что улучшилось, где теряем время и почему.','Последние 7 дней · данные подтверждены на 88%',sectionAnalytics],settings:['Настройки','Состояние и правила всей системы в одном месте.','Изменения доступны владельцу и администраторам',sectionSettings]};
    function render(){const v=$('variant').value,p=$('page').value,t=$('theme').value;const page=pages[p];const mock=$('mock');mock.dataset.variant=v;mock.dataset.theme=t;mock.innerHTML=`<aside class="rail"><div class="brand"><span class="brandmark">✳</span> Robopark</div><div class="park"><small>Текущий парк</small><b>Север · Москва ⌄</b></div><nav class="nav"><small>Рабочее место</small>${nav.map(([key,icon,label])=>`<button data-page="${key}" class="${p===key?'active':''}"><span class="ico">${icon}</span>${label}</button>`).join('')}</nav><div class="rail-foot"><b>Техблокдан</b><br>Владелец · синхронизировано</div></aside><div class="stage"><div class="topbar"><strong>Север / Москва <span style="color:var(--muted)">⌄</span></strong><aside><span>● Все службы доступны</span><span class="avatar">Т</span></aside></div><main class="content"><header class="pagehead"><div><p class="eyebrow">Robopark / ${page[0]} · демо</p><h1>${page[1]}</h1><p>${page[2]}</p></div><div class="head-actions"><button class="button">Сменить парк</button><button class="button primary">${p==='overview'?'Открыть очередь':p==='settings'?'Проверить систему':'Найти задачу'}</button></div></header>${page[3]()}</main></div><nav class="mobile-nav">${nav.map(([key,icon,label])=>`<button data-page="${key}" class="${p===key?'active':''}"><span class="ico">${icon}</span>${label}</button>`).join('')}</nav>`;mock.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{$('page').value=button.dataset.page;render()}));const url=new URL(location.href);url.searchParams.set('v',v);url.searchParams.set('page',p);url.searchParams.set('theme',t);history.replaceState(null,'',url)}
    ['variant','page','theme'].forEach(id=>$(id).addEventListener('change',render));render();
  </script>
